<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#1f5c2e"/>
<title>Mon Jardin MAVA</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="icons/icon-192.png"/>
<link rel="apple-touch-icon" href="icons/icon-192.png"/>
<style>
:root{
  --brand: #1f5c2e;
  --brand-dark: #153f20;
  --bg: #f4f1ea;
  --card: #ffffff;
  --ink: #24261f;
  --ink-soft: #5b5c53;
  --line: #e4ded0;
  --hydro: #1f7a8c; --hydro-dark:#155e6d; --hydro-light:#eaf6f8;
  --slim: #3f9142; --slim-dark:#2c6b2f; --slim-light:#eef7ec;
  --olla: #cc5f26; --olla-dark:#963f16; --olla-light:#fbe8db;
  --compost: #8a5a2e; --compost-dark:#5c3c1c; --compost-light:#f1e4d3;
  --gold: #e8a940;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family: 'Helvetica Neue', Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: contain;
}
#app{
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  position: relative;
  box-shadow: 0 0 40px rgba(0,0,0,0.08);
}
/* ---------- topbar ---------- */
.topbar{
  background: linear-gradient(120deg, var(--brand) 0%, #2c8a49 100%);
  color: white;
  padding: 14px 16px 16px 16px;
  border-radius: 0 0 20px 20px;
  position: sticky;
  top: 0;
  z-index: 20;
}
.topbar .row1{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.topbar .brand{display:flex; align-items:center; gap:8px;}
.topbar .brand img{height:30px; width:30px; border-radius:50%; background:white; padding:2px; display:block;}
.topbar .brand .name{font-weight:800; font-size:15px; letter-spacing:0.02em;}
.topbar .streak{
  display:flex; align-items:center; gap:4px;
  background: rgba(255,255,255,0.16);
  border-radius: 16px;
  padding: 4px 10px;
  font-weight:700;
  font-size: 13px;
}
.topbar .levelrow{display:flex; align-items:center; gap:8px; margin-top:10px;}
.topbar .levelicon{font-size:20px;}
.topbar .levelinfo{flex:1;}
.topbar .levelname{font-size:12px; font-weight:700; opacity:0.95;}
.topbar .xpbar{
  height:8px; background:rgba(255,255,255,0.25); border-radius:6px; overflow:hidden; margin-top:3px;
}
.topbar .xpfill{
  height:100%; background: var(--gold); border-radius:6px;
  transition: width 0.5s ease;
}
.topbar .xptext{font-size:10.5px; opacity:0.85; margin-top:2px;}

/* ---------- main view ---------- */
#view{
  flex:1;
  padding: 14px 14px 90px 14px;
}
h2.viewtitle{font-size:19px; margin:2px 0 12px 0; color:var(--brand-dark); font-weight:800;}
p.viewsub{margin:-8px 0 14px 0; font-size:12.5px; color:var(--ink-soft);}

.card{
  background: var(--card);
  border-radius: 14px;
  padding: 14px 15px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(30,30,20,0.06);
  border: 1px solid var(--line);
}
.card h3{margin:0 0 8px 0; font-size:14.5px; color:var(--brand-dark);}

/* empty state */
.empty{
  text-align:center;
  padding: 30px 14px;
  color: var(--ink-soft);
}
.empty .emoji{font-size:44px; display:block; margin-bottom:8px;}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  background: var(--brand);
  color:white; border:none; border-radius: 22px;
  padding: 10px 18px; font-size:14px; font-weight:700; cursor:pointer;
  box-shadow: 0 2px 6px rgba(31,92,46,0.3);
}
.btn.secondary{
  background: white; color: var(--brand-dark); border:2px solid var(--brand);
  box-shadow:none;
}
.btn.small{padding:6px 12px; font-size:12.5px; border-radius:16px;}
.btn.block{width:100%;}
.btn:active{transform: scale(0.97);}

/* tower card */
.tower-card{
  border-radius:16px; padding:14px 15px; margin-bottom:12px; color:white;
  position:relative; overflow:hidden; cursor:pointer;
}
.tower-card .top{display:flex; justify-content:space-between; align-items:flex-start;}
.tower-card .mascot{font-size:32px; line-height:1;}
.tower-card .nick{font-weight:800; font-size:15.5px;}
.tower-card .gamme{font-size:11px; opacity:0.9; letter-spacing:0.05em; text-transform:uppercase;}
.tower-card .meterwrap{margin-top:10px;}
.tower-card .meterlabel{font-size:11px; opacity:0.9; display:flex; justify-content:space-between;}
.tower-card .meter{height:8px; background:rgba(255,255,255,0.3); border-radius:6px; overflow:hidden; margin-top:3px;}
.tower-card .meterfill{height:100%; background:white; border-radius:6px;}
.tower-card .foot{display:flex; justify-content:space-between; margin-top:10px; font-size:11.5px; opacity:0.95;}
.tower-card .badge-overdue{
  background:rgba(255,255,255,0.92); color:#a33; font-weight:800; font-size:10.5px;
  padding:2px 8px; border-radius:10px;
}

/* task list */
.task-group{margin-bottom:10px;}
.task-group h4{font-size:11.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft); margin:0 0 6px 2px;}
.task{
  display:flex; align-items:center; gap:10px;
  background: var(--card); border:1px solid var(--line); border-radius:12px;
  padding:9px 11px; margin-bottom:7px;
}
.task .check{
  width:26px; height:26px; border-radius:50%; border:2px solid var(--line);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer;
  font-size:14px; color:transparent; background:white;
}
.task .check.done{background: var(--brand); border-color:var(--brand); color:white;}
.task .check.overdue{border-color:#c94b3f;}
.task .label{flex:1; font-size:13px;}
.task .due{font-size:10.5px; color: var(--ink-soft); white-space:nowrap;}
.task .due.overdue{color:#c94b3f; font-weight:700;}

/* plant chip list */
.chiprow{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 10px 0;}
.chip{
  background: var(--bg); border:1px solid var(--line); border-radius:16px;
  padding:5px 11px; font-size:12px; cursor:pointer; color:var(--ink);
}
.chip:active{transform:scale(0.96);}

.plant-row{
  display:flex; align-items:center; gap:9px; padding:8px 0; border-bottom:1px dashed var(--line);
}
.plant-row:last-child{border-bottom:none;}
.plant-row .pemoji{font-size:20px;}
.plant-row .pname{flex:1; font-size:13px; font-weight:600;}
.plant-row .pdate{font-size:10.5px; color:var(--ink-soft);}
.plant-row .harvested{text-decoration:line-through; opacity:0.55;}

/* journal */
.log-entry{display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line);}
.log-entry:last-child{border-bottom:none;}
.log-entry .licon{font-size:18px;}
.log-entry .ltext{flex:1; font-size:12.8px;}
.log-entry .ltime{font-size:10.5px; color:var(--ink-soft); white-space:nowrap;}

/* badges grid */
.badgegrid{display:grid; grid-template-columns: repeat(3,1fr); gap:10px;}
.badge{
  background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 6px;
  text-align:center;
}
.badge.locked{opacity:0.38;}
.badge .bicon{font-size:26px; display:block;}
.badge .bname{font-size:10.5px; font-weight:700; margin-top:4px;}

/* tabbar */
.tabbar{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:480px;
  background:white; border-top:1px solid var(--line);
  display:flex; z-index:30;
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.tabbar button{
  flex:1; background:none; border:none; padding:9px 2px 8px 2px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:2px;
  color: var(--ink-soft); font-size:10px; font-weight:700;
}
.tabbar button .ticon{font-size:19px;}
.tabbar button.active{color:var(--brand-dark);}

/* modal */
.overlay{
  position:fixed; inset:0; background:rgba(20,20,15,0.45); z-index:50;
  display:flex; align-items:flex-end; justify-content:center;
}
.overlay.center{align-items:center;}
.sheet{
  background:white; width:100%; max-width:480px; border-radius:20px 20px 0 0;
  padding:18px 18px 26px 18px; max-height:88vh; overflow-y:auto;
  animation: slideup 0.22s ease;
}
.overlay.center .sheet{border-radius:18px; max-height:82vh;}
@keyframes slideup{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet h3{margin:0 0 4px 0; font-size:17px; color:var(--brand-dark);}
.sheet .closebtn{
  position:absolute; top:14px; right:16px; background:var(--bg); border:none; border-radius:50%;
  width:30px; height:30px; font-size:15px; cursor:pointer; color:var(--ink-soft);
}
label.field{display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin:12px 0 5px 0;}
input[type=text], input[type=date], textarea, select{
  width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line);
  font-size:14px; font-family:inherit; background:white; color:var(--ink);
}
textarea{resize:vertical; min-height:60px;}
.gammepick{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:6px;}
.gammepick .g{
  border-radius:12px; padding:12px 8px; text-align:center; color:white; cursor:pointer; border:3px solid transparent;
}
.gammepick .g.selected{border-color:#222;}
.gammepick .g .gicon{font-size:22px; display:block;}
.gammepick .g .glabel{font-weight:800; font-size:12.5px; margin-top:3px;}

/* toasts & confetti */
#toast-container{position:fixed; top:128px; left:50%; transform:translateX(-50%); z-index:99; width:92%; max-width:400px; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none;}
.toast{
  background: var(--brand-dark); color:white; padding:9px 16px; border-radius:18px; font-size:12.5px; font-weight:700;
  box-shadow:0 4px 14px rgba(0,0,0,0.3); animation: toastin 0.25s ease; display:flex; align-items:center; gap:8px;
  text-align:center; max-width:100%;
}
@keyframes toastin{from{transform:translateY(-14px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.confetti-piece{
  position:fixed; top:-10px; width:8px; height:14px; z-index:98; border-radius:2px; pointer-events:none;
  animation: fall linear forwards;
}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg); opacity:0.2;}}

/* fiche gamme panel */
.fiche{border-radius:14px; padding:13px 14px; margin-bottom:12px; color:white;}
.fiche .specs{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0;}
.fiche .spec{background:rgba(255,255,255,0.18); border-radius:14px; padding:4px 10px; font-size:10.5px;}
.fiche ul{margin:6px 0 0 0; padding-left:18px; font-size:12.5px;}
.fiche li{margin-bottom:3px;}

.switch{
  position:relative; display:inline-block; width:44px; height:25px; flex-shrink:0;
}
.switch input{opacity:0; width:0; height:0;}
.slider{
  position:absolute; cursor:pointer; inset:0; background:#ccc; border-radius:25px; transition:0.2s;
}
.slider:before{
  content:""; position:absolute; height:19px; width:19px; left:3px; bottom:3px; background:white; border-radius:50%; transition:0.2s;
}
input:checked + .slider{background:var(--brand);}
input:checked + .slider:before{transform:translateX(19px);}
.settingsrow{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line);}
.settingsrow:last-child{border-bottom:none;}
.small-muted{font-size:11.5px; color:var(--ink-soft);}

.install-banner{
  background: linear-gradient(120deg, var(--gold), #f2c268); color:#4a3200; border-radius:14px;
  padding:12px 14px; margin-bottom:12px; font-size:12.5px; font-weight:700;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar"></header>
  <main id="view"></main>
  <nav class="tabbar" id="tabbar">
    <button data-tab="home"><span class="ticon">🏠</span>Accueil</button>
    <button data-tab="towers"><span class="ticon">🪴</span>Mes tours</button>
    <button data-tab="journal"><span class="ticon">📓</span>Journal</button>
    <button data-tab="badges"><span class="ticon">🏆</span>Succès</button>
    <button data-tab="settings"><span class="ticon">⚙️</span>Réglages</button>
  </nav>
</div>
<div id="toast-container"></div>
<div id="modal-root"></div>

/* ---------------- Utilitaires date ---------------- */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDays(iso, n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000); }
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('fr-FR', {day:'numeric', month:'short', year:'numeric'});
}
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

/* ---------------- État & stockage ---------------- */
const STORAGE_KEY = 'mava_garden_v1';

function defaultState(){
  return {
    version:1, xp:0, badges:[],
    streak:{count:0, lastDate:null},
    towers:[],
    school:{enabled:false, className:'', responsables:[]},
    log:[]
  };
}
let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){
    console.warn('Lecture des données impossible, redémarrage propre.', e);
    return defaultState();
  }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.warn('Sauvegarde impossible (stockage plein ou navigateur privé).', e); }
}

/* ---------------- Calculs jeu ---------------- */
function levelInfo(xp){
  let idx=0;
  for(let i=0;i<LEVELS.length;i++){ if(xp>=LEVELS[i].min) idx=i; }
  const cur = LEVELS[idx];
  const next = LEVELS[idx+1];
  const span = next ? next.min-cur.min : 1;
  const into = next ? xp-cur.min : span;
  const pct = next ? Math.min(100, Math.round(100*into/span)) : 100;
  return {index:idx, level:cur, next, into, span, pct};
}
function gainXp(amount, reason){
  state.xp += amount;
  addLog('✨', `+${amount} XP — ${reason}`);
}
function addLog(icon, text){
  state.log.unshift({ts:Date.now(), icon, text});
  if(state.log.length>200) state.log.length=200;
}
function totalPlants(s){ return s.towers.reduce((n,t)=>n+t.plants.length,0); }
function totalHarvested(s){ return s.towers.reduce((n,t)=>n+t.plants.filter(p=>p.harvestedDate).length,0); }
function totalCompletions(s){ return s.towers.reduce((n,t)=>n+Object.keys(t.tasksDone).length,0); }

function taskDue(tower, task){
  const last = tower.tasksDone[task.id] || tower.installDate;
  return addDays(last, task.freq);
}
function isOverdue(tower, task){
  return taskDue(tower, task) < todayISO();
}
function overdueCount(tower){
  const g = GAMMES[tower.gamme];
  return g.tasks.filter(t=>isOverdue(tower,t)).length;
}
function healthPct(tower){
  const g = GAMMES[tower.gamme];
  if(g.tasks.length===0) return 100;
  const ok = g.tasks.filter(t=>!isOverdue(tower,t)).length;
  return Math.round(100*ok/g.tasks.length);
}
function mascotFor(pct){
  if(pct>=80) return '🌿';
  if(pct>=50) return '🌱';
  if(pct>=25) return '🥀';
  return '🍂';
}

function touchStreak(){
  const today = todayISO();
  if(state.streak.lastDate===today) return;
  if(state.streak.lastDate && daysBetween(state.streak.lastDate, today)===1){
    state.streak.count += 1;
  } else {
    state.streak.count = 1;
  }
  state.streak.lastDate = today;
}

function checkNewBadges(){
  const newly=[];
  BADGES.forEach(b=>{
    if(!state.badges.includes(b.id) && b.check(state)){
      state.badges.push(b.id);
      newly.push(b);
    }
  });
  return newly;
}

function completeTask(towerId, taskId){
  const tower = state.towers.find(t=>t.id===towerId);
  if(!tower) return;
  const overdue = isOverdue(tower, GAMMES[tower.gamme].tasks.find(t=>t.id===taskId));
  tower.tasksDone[taskId] = todayISO();
  const task = GAMMES[tower.gamme].tasks.find(t=>t.id===taskId);
  gainXp(overdue?10:15, `${task.label} (${tower.nickname})`);
  afterAction();
}

function afterAction(){
  touchStreak();
  const newBadges = checkNewBadges();
  saveState();
  render();
  newBadges.forEach(b=>{
    showToast(`${b.icon} Succès débloqué : ${b.label}`);
    burstConfetti();
  });
}

/* ---------------- UI : toasts & confettis ---------------- */
function showToast(text){
  const c = document.getElementById('toast-container');
  while(c.children.length>=2){ c.firstChild.remove(); }
  const el = document.createElement('div');
  el.className='toast';
  el.textContent = text;
  c.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .4s'; el.style.opacity='0'; setTimeout(()=>el.remove(),400); }, 2200);
}
function burstConfetti(){
  const colors = ['#1f7a8c','#3f9142','#cc5f26','#e8a940','#8a5a2e'];
  for(let i=0;i<26;i++){
    const p = document.createElement('div');
    p.className='confetti-piece';
    p.style.left = (Math.random()*100)+'vw';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration = (1.6+Math.random()*1)+'s';
    p.style.opacity = (0.7+Math.random()*0.3).toString();
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 2800);
  }
}

}

}

/* ---------------- Modales ---------------- */
function openModal(html){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="overlay" id="overlay"><div class="sheet">${html}</div></div>`;
  document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

function openAddTowerModal(){
  openModal(`
    <button class="closebtn" data-action="close-modal">✕</button>
    <h3>Ajouter une MAVA</h3>
    <p class="small-muted">Choisissez la gamme, donnez-lui un petit nom</p>
    <div class="gammepick" id="gammepick">
      ${Object.values(GAMMES).map(g=>`
        <div class="g" data-pick-gamme="${g.key}" style="background:linear-gradient(120deg, ${g.hex}, ${g.hexDark});">
          <span class="gicon">${g.icon}</span>
          <div class="glabel">${g.label}</div>
        </div>
      `).join('')}
    </div>
    <label class="field">Surnom de votre tour</label>
    <input type="text" id="tower-nickname" placeholder="ex : La tour du balcon"/>
    <label class="field">Date d'installation</label>
    <input type="date" id="tower-date" value="${todayISO()}"/>
    <button class="btn block" style="margin-top:16px;" data-action="confirm-add-tower">Ajouter cette tour</button>
  `);
  let picked = null;
  document.querySelectorAll('#gammepick .g').forEach(el=>{
    el.addEventListener('click', ()=>{
      document.querySelectorAll('#gammepick .g').forEach(x=>x.classList.remove('selected'));
      el.classList.add('selected');
      picked = el.dataset.pickGamme;
    });
  });
  document.querySelector('[data-action="confirm-add-tower"]').addEventListener('click', ()=>{
    const nickname = document.getElementById('tower-nickname').value.trim();
    const date = document.getElementById('tower-date').value || todayISO();
    if(!picked){ showToast('Choisissez une gamme 🙂'); return; }
    if(!nickname){ showToast('Donnez un petit nom à votre tour 🌱'); return; }
    const tower = { id:uid(), gamme:picked, nickname, installDate:date, tasksDone:{}, plants:[] };
    state.towers.push(tower);
    gainXp(5, `Nouvelle tour ajoutée : ${nickname}`);
    closeModal();
    afterAction();
    showToast('🪴 Tour ajoutée !');
    burstConfetti();
  });
}

/* ---------------- Liaison des événements de la vue courante ---------------- */
function bindViewEvents(){
  document.querySelectorAll('[data-open-tower]').forEach(el=>{
    el.addEventListener('click', ()=>{ currentTowerId = el.dataset.openTower; render(); window.scrollTo(0,0); });
  });
  document.querySelectorAll('[data-complete]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [towerId, taskId] = el.dataset.complete.split('|');
      completeTask(towerId, taskId);
    });
  });
  document.querySelectorAll('[data-action="add-tower"]').forEach(el=> el.addEventListener('click', openAddTowerModal));
  document.querySelectorAll('[data-action="back-towers"]').forEach(el=> el.addEventListener('click', ()=>{ currentTowerId=null; currentTab='towers'; render(); }));
  document.querySelectorAll('[data-action="remove-tower"]').forEach(el=> el.addEventListener('click', ()=>{
    if(confirm('Retirer définitivement cette tour et ses plantes ?')){
      state.towers = state.towers.filter(t=>t.id!==el.dataset.tower);
      currentTowerId=null; currentTab='towers';
      saveState(); render();
    }
  }));
  document.querySelectorAll('[data-fillplant]').forEach(el=> el.addEventListener('click', ()=>{
    document.getElementById('newplantname').value = el.dataset.fillplant;
  }));
  document.querySelectorAll('[data-action="add-plant"]').forEach(el=> el.addEventListener('click', ()=>{
    const towerId = el.dataset.tower;
    const input = document.getElementById('newplantname');
    const name = input.value.trim();
    if(!name){ showToast('Donnez un nom à la plante 🌱'); return; }
    const tower = state.towers.find(t=>t.id===towerId);
    tower.plants.push({id:uid(), name, plantedDate:todayISO(), harvestedDate:null});
    gainXp(5, `Plante ajoutée : ${name}`);
    afterAction();
    showToast('🌱 Plante ajoutée !');
  }));
  document.querySelectorAll('[data-harvest]').forEach(el=> el.addEventListener('click', ()=>{
    const [towerId, plantId] = el.dataset.harvest.split('|');
    const tower = state.towers.find(t=>t.id===towerId);
    const plant = tower.plants.find(p=>p.id===plantId);
    plant.harvestedDate = todayISO();
    gainXp(15, `Récolte : ${plant.name}`);
    afterAction();
    showToast('🧺 Bonne récolte !');
    burstConfetti();
  }));
  document.querySelectorAll('[data-action="close-modal"]').forEach(el=> el.addEventListener('click', closeModal));

  const schoolToggle = document.getElementById('school-toggle');
  if(schoolToggle){
    schoolToggle.addEventListener('change', ()=>{
      state.school.enabled = schoolToggle.checked;
      saveState(); render();
    });
  }
  const saveSchoolBtn = document.querySelector('[data-action="save-school"]');
  if(saveSchoolBtn){
    saveSchoolBtn.addEventListener('click', ()=>{
      state.school.className = document.getElementById('class-name').value.trim();
      state.school.responsables = document.getElementById('class-list').value.split('\n').map(s=>s.trim()).filter(Boolean);
      saveState();
      showToast('✅ Réglages enregistrés');
      render();
    });
  }
  const exportBtn = document.querySelector('[data-action="export-data"]');
  if(exportBtn){
    exportBtn.addEventListener('click', ()=>{
      const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `mava-jardin-sauvegarde-${todayISO()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      showToast('💾 Sauvegarde téléchargée');
    });
  }
  const importFile = document.getElementById('import-file');
  if(importFile){
    importFile.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const parsed = JSON.parse(reader.result);
          state = Object.assign(defaultState(), parsed);
          saveState(); render();
          showToast('✅ Données restaurées');
        }catch(err){ showToast('❌ Fichier invalide'); }
      };
      reader.readAsText(file);
    });
  }
  const resetBtn = document.querySelector('[data-action="reset-data"]');
  if(resetBtn){
    resetBtn.addEventListener('click', ()=>{
      if(confirm('Tout effacer ? Cette action est irréversible (pensez à exporter une sauvegarde avant).')){
        state = defaultState();
        saveState(); render();
      }
    });
  }
}

/* ---------------- Échappement HTML simple ---------------- */
function escapeHTML(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){ return escapeHTML(str); }

/* ---------------- Bannière d'installation PWA ---------------- */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  const slot = document.getElementById('install-banner-slot');
  if(slot){
    slot.innerHTML = `<div class="install-banner"><span>📲 Installer l'app sur cet écran d'accueil</span><button class="btn small" id="install-btn">Installer</button></div>`;
    document.getElementById('install-btn').addEventListener('click', async ()=>{
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt=null;
    });
  }
});

/* ---------------- Service worker ---------------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

/* ---------------- Démarrage ---------------- */
touchStreak();
saveState();
render();
</script>
