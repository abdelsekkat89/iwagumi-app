<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patrimoine MAVA — IWAGUMI</title>
<meta name="description" content="Assistant de culture pour vos modules MAVA Hydro, Slim, Olla et Compost — par IWAGUMI.">
<meta name="theme-color" content="#1f4d3d">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#221f1a; --ink-soft:#5b564c; --ink-faint:#8a8375;
    --paper:#faf7f1; --paper-alt:#f2ece0; --paper-card:#ffffff;
    --forest:#1f4d3d; --forest-dark:#123527; --forest-soft:#e4ede8;
    --terracotta:#b5652d; --terracotta-soft:#f3e3d3;
    --gold:#a9812f; --gold-soft:#f2e8cd; --gold-dark:#7c5f20;
    --line:#e1d8c5; --line-soft:#ece5d5;
    --danger:#a13d3d;
    --shadow: 0 1px 2px rgba(34,31,26,.04), 0 6px 20px rgba(34,31,26,.06);
    --radius: 14px;
    --hydro:#2b6e7e; --hydro-dark:#1d4d59; --hydro-soft:#e4eef0;
    --slim:#3f7d52; --slim-dark:#2b5938; --slim-soft:#e7f0e8;
    --olla:#b5652d; --olla-dark:#8a4a1e; --olla-soft:#f3e3d3;
    --compost:#6b4a2f; --compost-dark:#4a3220; --compost-soft:#ece2d6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',Georgia,'Times New Roman',serif;}
  .eyebrow{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); font-weight:600;
  }
  button{font-family:inherit;}
  a{color:inherit;}
  svg.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none;}
  .icon-sm{width:16px;height:16px;}
  .icon-lg{width:28px;height:28px;}

  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);position:relative;}

  /* Topbar */
  .topbar{
    display:flex;align-items:center;gap:12px;padding:16px 18px 14px;
    border-bottom:1px solid var(--line);
    background:var(--paper);
    position:sticky;top:0;z-index:20;
  }
  .brand-mark{width:38px;height:38px;border-radius:10px;overflow:hidden;flex:none;box-shadow:var(--shadow);}
  .brand-mark img{width:100%;height:100%;object-fit:cover;display:block;}
  .brand-text h1{margin:0;font-size:18px;font-weight:600;line-height:1.1;letter-spacing:.01em;}
  .brand-text .tag{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;}

  /* View */
  #view{flex:1;padding:18px 18px 100px;}
  .view-head{margin-bottom:18px;}
  .view-head h2{font-size:22px;margin:0 0 4px;font-weight:600;}
  .view-head p{margin:0;color:var(--ink-soft);font-size:13.5px;}

  /* Tabbar */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    max-width:520px;margin:0 auto;
    display:flex;background:var(--paper-card);
    border-top:1px solid var(--line);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  .tab-btn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
    background:none;border:none;color:var(--ink-faint);padding:6px 2px;cursor:pointer;
    font-size:10.5px;letter-spacing:.02em;border-radius:10px;
  }
  .tab-btn .icon{stroke:var(--ink-faint);}
  .tab-btn.active{color:var(--forest);}
  .tab-btn.active .icon{stroke:var(--forest);}
  .tab-dot{width:4px;height:4px;border-radius:50%;background:transparent;margin-top:-2px;}
  .tab-btn.active .tab-dot{background:var(--gold);}

  /* Cards */
  .card{background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
  .card-pad{padding:16px;}
  .card-quiet{background:var(--paper-alt);border:1px solid var(--line-soft);}
  .stack{display:flex;flex-direction:column;gap:12px;}
  .row{display:flex;align-items:center;gap:10px;}
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;}

  /* Stat tiles */
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .stat-tile{background:var(--paper-card);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center;}
  .stat-tile .num{font-family:'Fraunces',serif;font-size:22px;font-weight:600;line-height:1;color:var(--forest);}
  .stat-tile .lbl{font-size:10.5px;color:var(--ink-faint);margin-top:5px;letter-spacing:.02em;}

  /* Gauge */
  .gauge-wrap{position:relative;display:flex;align-items:center;justify-content:center;flex:none;}
  .gauge-value{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;}
  .gauge-value b{font-family:'Fraunces',serif;font-size:15px;font-weight:600;color:var(--ink);}
  .gauge-value span{font-size:8.5px;color:var(--ink-faint);letter-spacing:.03em;}

  /* Hero patrimoine */
  .hero{padding:20px;border-radius:18px;background:linear-gradient(160deg,var(--forest) 0%,var(--forest-dark) 100%);color:#f4f1e8;box-shadow:var(--shadow);}
  .hero .eyebrow{color:#cfe0d6;}
  .hero h2{margin:2px 0 12px;font-size:20px;color:#fff;font-weight:600;}
  .hero-row{display:flex;align-items:center;gap:16px;}
  .hero-meta{flex:1;display:flex;flex-direction:column;gap:6px;}
  .hero-meta .stade{font-size:13.5px;color:#f4f1e8;font-weight:600;}
  .hero-meta .next{font-size:11.5px;color:#cfe0d6;}
  .hero-bar{height:5px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:2px;}
  .hero-bar i{display:block;height:100%;background:var(--gold);border-radius:3px;}

  /* Section title */
  .section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px;}
  .section-title h3{font-size:14px;margin:0;font-weight:600;letter-spacing:.02em;}
  .link-btn{background:none;border:none;color:var(--forest);font-size:12.5px;font-weight:600;cursor:pointer;padding:4px 0;}

  /* Empty state */
  .empty{text-align:center;padding:36px 18px;color:var(--ink-soft);}
  .empty .icon-lg{margin:0 auto 12px;stroke:var(--ink-faint);}
  .empty h3{font-size:16px;margin:0 0 6px;color:var(--ink);}
  .empty p{font-size:13px;margin:0 0 16px;color:var(--ink-soft);}

  .btn{border:none;border-radius:10px;padding:11px 16px;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
  .btn-primary{background:var(--forest);color:#fff;}
  .btn-primary:active{background:var(--forest-dark);}
  .btn-ghost{background:none;border:1px solid var(--line);color:var(--ink);}
  .btn-gold{background:var(--gold);color:#fff;}
  .btn-block{width:100%;}
  .btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}
  .btn-danger{background:none;border:1px solid var(--danger);color:var(--danger);}
  .btn-icon{background:none;border:1px solid var(--line);border-radius:9px;padding:8px;display:inline-flex;}

  /* Tower card */
  .tower-card{padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--paper-card);box-shadow:var(--shadow);cursor:pointer;}
  .tower-card__top{display:flex;align-items:center;gap:12px;}
  .gamme-chip{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;}
  .tower-card__name{font-weight:600;font-size:14.5px;}
  .tower-card__gamme{font-size:11px;color:var(--ink-faint);letter-spacing:.03em;text-transform:uppercase;font-weight:600;}
  .tower-card__meta{display:flex;gap:14px;margin-top:12px;font-size:11.5px;color:var(--ink-soft);}
  .tower-card__meta b{color:var(--ink);font-weight:600;}
  .chevron{margin-left:auto;stroke:var(--ink-faint);}

  /* Grid of towers */
  .tower-grid{display:flex;flex-direction:column;gap:12px;}

  /* Task row */
  .task-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line-soft);}
  .task-row:last-child{border-bottom:none;}
  .task-check{width:26px;height:26px;border-radius:8px;border:1.6px solid var(--ink-faint);background:none;flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .task-check.done{background:var(--forest);border-color:var(--forest);}
  .task-check svg{width:15px;height:15px;stroke:#fff;opacity:0;}
  .task-check.done svg{opacity:1;}
  .task-label{flex:1;font-size:13.5px;}
  .task-label .sub{display:block;font-size:11px;color:var(--ink-faint);margin-top:2px;}
  .due-pill{font-size:10.5px;font-weight:600;color:var(--ink-faint);white-space:nowrap;}
  .due-pill.overdue{color:var(--terracotta);}

  /* Specimen row */
  .specimen-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft);}
  .specimen-row:last-child{border-bottom:none;}
  .specimen-dot{width:9px;height:9px;border-radius:50%;background:var(--forest);flex:none;}
  .specimen-name{font-size:13.5px;font-weight:600;flex:1;}
  .specimen-age{font-size:11px;color:var(--ink-faint);}

  /* Distinctions */
  .distinction-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .distinction-card{padding:14px 10px;border-radius:14px;border:1px solid var(--line);background:var(--paper-card);text-align:center;}
  .distinction-card.locked{opacity:.42;filter:grayscale(1);}
  .distinction-card .seal{width:38px;height:38px;margin:0 auto 8px;border-radius:50%;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;}
  .distinction-card .seal svg{stroke:var(--gold-dark);}
  .distinction-card .name{font-size:12px;font-weight:600;line-height:1.25;}
  .distinction-card .desc{font-size:10.5px;color:var(--ink-faint);margin-top:4px;line-height:1.3;}

  /* Journal */
  .journal-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft);}
  .journal-row:last-child{border-bottom:none;}
  .journal-icon{width:30px;height:30px;border-radius:9px;background:var(--forest-soft);display:flex;align-items:center;justify-content:center;flex:none;}
  .journal-icon svg{stroke:var(--forest);width:16px;height:16px;}
  .journal-text{flex:1;font-size:13px;}
  .journal-text .meta{font-size:11px;color:var(--ink-faint);margin-top:2px;}
  .journal-date{font-size:10.5px;color:var(--ink-faint);white-space:nowrap;padding-top:2px;}

  /* Forms */
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;letter-spacing:.01em;}
  .field input[type=text],.field input[type=date],.field select,.field textarea{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;
    font-family:inherit;background:var(--paper-alt);color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:70px;}
  .gamme-pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .gamme-pick{border:1.6px solid var(--line);border-radius:12px;padding:12px;text-align:center;cursor:pointer;background:var(--paper-card);}
  .gamme-pick.selected{border-color:var(--forest);background:var(--forest-soft);}
  .gamme-pick .gamme-chip{margin:0 auto 8px;}
  .gamme-pick .nm{font-size:12.5px;font-weight:600;}
  .gamme-pick .cap{font-size:10.5px;color:var(--ink-faint);}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-size:12.5px;cursor:pointer;background:var(--paper-card);}
  .chip.selected{background:var(--forest);border-color:var(--forest);color:#fff;}
  .switch{position:relative;width:42px;height:24px;flex:none;}
  .switch input{opacity:0;width:0;height:0;position:absolute;}
  .switch .track{position:absolute;inset:0;background:var(--line);border-radius:20px;transition:.15s;}
  .switch .knob{position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .switch input:checked + .track{background:var(--forest);}
  .switch input:checked + .track .knob{transform:translateX(18px);}
  .switch input:checked ~ .knob{transform:translateX(18px);}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(30,26,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
  .modal-box{background:var(--paper);width:100%;max-width:520px;border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom));}
  @media(min-width:560px){
    .modal-overlay{align-items:center;}
    .modal-box{border-radius:18px;max-height:80vh;}
  }
  .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-header h3{margin:0;font-size:17px;font-weight:600;}
  .modal-close{background:none;border:none;color:var(--ink-faint);cursor:pointer;padding:4px;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}

  /* Toast */
  #toast-container{position:fixed;top:76px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:200;pointer-events:none;padding:0 18px;}
  .toast{
    background:var(--paper-card);border-left:3px solid var(--gold);border-radius:10px;box-shadow:var(--shadow);
    padding:10px 16px;font-size:12.5px;display:flex;align-items:center;gap:10px;max-width:90%;
    animation:toastin .25s ease-out;
  }
  .toast svg{stroke:var(--gold-dark);width:18px;height:18px;flex:none;}
  .toast b{display:block;font-size:12.5px;}
  .toast .sub{color:var(--ink-faint);font-size:11px;}
  @keyframes toastin{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}

  /* Certificate */
  .certificate-wrap{padding:14px 0;}
  .certificate-sheet{
    background:#fffdf7;border:2px solid var(--forest);border-radius:4px;padding:34px 26px;position:relative;
    box-shadow:var(--shadow);
  }
  .certificate-sheet::before{
    content:"";position:absolute;inset:8px;border:1px solid var(--gold);border-radius:2px;pointer-events:none;
  }
  .certificate-inner{text-align:center;position:relative;z-index:1;}
  .certificate-logo{width:56px;height:56px;margin:0 auto 10px;border-radius:50%;overflow:hidden;}
  .certificate-logo img{width:100%;height:100%;object-fit:cover;}
  .certificate-eyebrow{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-dark);font-weight:700;}
  .certificate-title{font-family:'Fraunces',serif;font-size:22px;margin:8px 0 18px;color:var(--forest-dark);}
  .certificate-name{font-family:'Fraunces',serif;font-size:26px;font-weight:600;margin:6px 0;border-bottom:1px solid var(--line);display:inline-block;padding-bottom:6px;min-width:70%;}
  .certificate-body{font-size:13.5px;color:var(--ink-soft);line-height:1.7;margin:14px auto;max-width:380px;}
  .certificate-foot{display:flex;justify-content:space-between;margin-top:30px;font-size:11px;color:var(--ink-faint);}
  .certificate-foot .sig{border-top:1px solid var(--ink-faint);padding-top:6px;min-width:130px;text-align:center;}

  @media print{
    body *{visibility:hidden;}
    .certificate-sheet, .certificate-sheet *{visibility:visible;}
    .certificate-sheet{position:fixed;inset:0;border:none;box-shadow:none;margin:0;}
    #app > .topbar, #app > .tabbar, .no-print{display:none !important;}
  }

  .school-banner{background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:10px 14px;font-size:12px;color:var(--gold-dark);margin-bottom:14px;display:flex;align-items:center;gap:10px;}

  .install-note{font-size:11px;color:var(--ink-faint);text-align:center;margin-top:18px;line-height:1.5;}
</style>
</head>

/* ============================= ETAT ============================= */
const STORAGE_KEY = 'mava_patrimoine_v1';
function uuid(){return 'id-'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);}
function todayISO(){return new Date().toISOString().slice(0,10);}
function addDays(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);}
function fmtDate(iso){
  const d=new Date(iso+'T00:00:00');
  return d.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
}
function fmtDateShort(iso){
  const d=new Date(iso+'T00:00:00');
  return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
}

function defaultState(){
  return {
    version:2, xp:0, badges:[], streak:{count:0,lastDate:null},
    towers:[], school:{enabled:false,className:'',responsables:[]},
    certificates:[], log:[],
  };
}
let state = loadState();
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){ return defaultState(); }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

function stadeIndex(xp){
  let idx=0;
  for(let i=0;i<STADES.length;i++){ if(xp>=STADES[i].min) idx=i; }
  return idx;
}
function stadeProgress(xp){
  const idx = stadeIndex(xp);
  const cur = STADES[idx];
  const next = STADES[idx+1];
  if(!next) return {pct:100, idx, cur, next:null};
  const pct = Math.round(((xp-cur.min)/(next.min-cur.min))*100);
  return {pct:Math.max(2,Math.min(100,pct)), idx, cur, next};
}

function taskDue(tower, task){
  const last = tower.tasksDone[task.id] || tower.installDate;
  return addDays(last, task.freq);
}
function isOverdue(tower, task){ return taskDue(tower, task) < todayISO(); }
function overdueCount(tower){
  const g = GAMMES[tower.gamme];
  return g.tasks.filter(t=>isOverdue(tower,t)).length;
}
function healthPct(tower){
  const g = GAMMES[tower.gamme];
  if(!g.tasks.length) return 100;
  const late = g.tasks.filter(t=>isOverdue(tower,t)).length;
  return Math.round(100 * (g.tasks.length-late) / g.tasks.length);
}
function totalHarvests(s){
  return s.towers.reduce((acc,t)=> acc + (t.harvested||0), 0);
}
function totalCompletions(s){
  return s.towers.reduce((acc,t)=> acc + Object.keys(t.tasksDone||{}).length + (t.completionCount||0), 0);
}
function portfolioVitality(s){
  if(!s.towers.length) return 0;
  return Math.round(s.towers.reduce((a,t)=>a+healthPct(t),0)/s.towers.length);
}

/* ============================= GAUGE (jauge radiale SVG) ============================= */
function gaugeSVG(pct, opts){
  opts = opts||{};
  const size=opts.size||64, stroke=opts.stroke||6;
  const color=opts.color||'var(--forest)', track=opts.track||'rgba(34,31,26,.08)';
  const r=(size-stroke)/2, c=2*Math.PI*r;
  const p=Math.max(0,Math.min(100,pct));
  const off=c*(1-p/100);
  return `<div class="gauge-wrap" style="width:${size}px;height:${size}px;">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
        transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset .4s;"/>
    </svg>
    <div class="gauge-value">${opts.center||`<b>${p}%</b>`}</div>
  </div>`;
}

/* ============================= XP / ACTIONS ============================= */
function gainXp(n){ state.xp += n; }
function touchStreak(){
  const t = todayISO();
  if(state.streak.lastDate === t) return;
  const y = addDays(t,-1);
  state.streak.count = (state.streak.lastDate === y) ? state.streak.count+1 : 1;
  state.streak.lastDate = t;
}
function checkNewBadges(){
  const fresh = [];
  DISTINCTIONS.forEach(b=>{
    if(!state.badges.includes(b.id) && b.test(state)){
      state.badges.push(b.id);
      fresh.push(b);
    }
  });
  return fresh;
}
function afterAction(logEntry){
  touchStreak();
  if(logEntry) state.log.unshift(Object.assign({id:uuid(), date:todayISO()}, logEntry));
  const fresh = checkNewBadges();
  saveState();
  render();
  fresh.forEach(b=> showToast(b.name, b.desc, b.icon));
}

function addTower(gammeKey, nickname){
  const t = {
    id:uuid(), gamme:gammeKey, nickname: nickname || GAMMES[gammeKey].label,
    installDate: todayISO(), tasksDone:{}, plants:[], harvested:0, completionCount:0,
  };
  state.towers.push(t);
  gainXp(20);
  afterAction({type:'tower', text:`Nouveau module installé — ${t.nickname}`, gammeKey});
}
function completeTask(towerId, taskId){
  const t = state.towers.find(x=>x.id===towerId);
  if(!t) return;
  const g = GAMMES[t.gamme];
  const task = g.tasks.find(x=>x.id===taskId);
  const wasLate = isOverdue(t, task);
  t.tasksDone[taskId] = todayISO();
  t.completionCount = (t.completionCount||0)+1;
  gainXp(wasLate?10:6);
  afterAction({type:'task', text:`${task.label}`, gammeKey:t.gamme, towerName:t.nickname});
}
function addPlant(towerId, plantName){
  const t = state.towers.find(x=>x.id===towerId);
  if(!t) return;
  if(t.plants.length >= GAMMES[t.gamme].capacity) return;
  t.plants.push({id:uuid(), name:plantName, date:todayISO()});
  gainXp(10);
  afterAction({type:'plant', text:`Spécimen installé — ${plantName}`, gammeKey:t.gamme, towerName:t.nickname});
}
function harvestPlant(towerId, plantId){
  const t = state.towers.find(x=>x.id===towerId);
  if(!t) return;
  const p = t.plants.find(x=>x.id===plantId);
  if(!p) return;
  t.plants = t.plants.filter(x=>x.id!==plantId);
  t.harvested = (t.harvested||0)+1;
  gainXp(15);
  afterAction({type:'harvest', text:`Récolte — ${p.name}`, gammeKey:t.gamme, towerName:t.nickname});
}

/* ============================= TOAST (sobre, sans confettis) ============================= */
function showToast(title, sub, icon){
  const cont = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className='toast';
  el.innerHTML = `${icon||ICONS.seal}<div><b>${title}</b><div class="sub">${sub||''}</div></div>`;
  cont.appendChild(el);
  while(cont.children.length>2){ cont.removeChild(cont.firstChild); }
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3200);
}

          return `<div class="gamme-pick ${picked===k?'selected':''}" data-pick-gamme="${k}">
            <div class="gamme-chip" style="background:${g.colorSoft};color:${g.colorDark};">${ICONS.leaf}</div>
            <div class="nm">${g.label}</div><div class="cap">${g.capacity} plants</div>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="field"><label>Nom de ce module (optionnel)</label>
      <input type="text" id="tower-nickname" placeholder="ex. Terrasse, Salle B...">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-block" data-close-modal>Annuler</button>
      <button class="btn btn-primary btn-block" data-action="confirm-add-tower">Ajouter</button>
    </div>`;
  openModal(body());
  window.__pickedGamme = null;
  attachAddTowerHandlers();
  function attachAddTowerHandlers(){
    document.querySelectorAll('[data-pick-gamme]').forEach(el=>{
      el.onclick = ()=>{ window.__pickedGamme = el.getAttribute('data-pick-gamme'); picked = window.__pickedGamme;
        document.querySelectorAll('.gamme-pick').forEach(x=>x.classList.remove('selected'));
        el.classList.add('selected');
      };
    });
    const confirmBtn = document.querySelector('[data-action="confirm-add-tower"]');
    if(confirmBtn) confirmBtn.onclick = ()=>{
      if(!window.__pickedGamme){ return; }
      const nick = document.getElementById('tower-nickname').value.trim();
      addTower(window.__pickedGamme, nick);
      closeModal();
    };
  }
}

function modalAddPlant(towerId){
  const t = state.towers.find(x=>x.id===towerId);
  const g = GAMMES[t.gamme];
  const remaining = g.capacity - t.plants.length;
  const html = `
    <div class="modal-header"><h3>Nouveau spécimen</h3><button class="modal-close" data-close-modal>${ICONS.close}</button></div>
    <p style="font-size:12.5px;color:var(--ink-soft);margin-top:-8px;">${remaining} emplacement${remaining>1?'s':''} disponible${remaining>1?'s':''} sur ${g.capacity}.</p>
    <div class="chip-row" id="plant-chip-row">
      ${g.plants.map(p=>`<div class="chip" data-plant="${p}">${p}</div>`).join('')}
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-block" data-close-modal>Annuler</button>
      <button class="btn btn-primary btn-block" data-action="confirm-add-plant" data-tower="${towerId}">Ajouter</button>
    </div>`;
  openModal(html);
  let sel = null;
  document.querySelectorAll('[data-plant]').forEach(el=>{
    el.onclick = ()=>{ sel = el.getAttribute('data-plant');
      document.querySelectorAll('[data-plant]').forEach(x=>x.classList.remove('selected'));
      el.classList.add('selected');
    };
  });
  document.querySelector('[data-action="confirm-add-plant"]').onclick = ()=>{
    if(!sel) return;
    addPlant(towerId, sel);
    closeModal();
  };
}

function modalCertificate(){
  const towers = state.towers;
  const motifs = [
    `Achèvement d'un cycle complet de culture MAVA`,
    `Assiduité exemplaire dans l'entretien du jardin pédagogique`,
    `Réussite du programme d'agriculture urbaine IWAGUMI`,
    `Contribution distinguée au patrimoine végétal de l'établissement`,
  ];
  const html = `
    <div class="modal-header"><h3>Générer un certificat</h3><button class="modal-close" data-close-modal>${ICONS.close}</button></div>
    <div class="field"><label>Nom de l'élève ou de la classe</label>
      <input type="text" id="cert-name" placeholder="ex. Yasmine B. — CM2"></div>
    <div class="field"><label>Motif</label>
      <select id="cert-motif">${motifs.map(m=>`<option>${m}</option>`).join('')}<option value="__custom">Autre (personnalisé)</option></select></div>
    <div class="field" id="cert-custom-wrap" style="display:none;"><label>Motif personnalisé</label>
      <textarea id="cert-custom"></textarea></div>
    <div class="field"><label>Module concerné (optionnel)</label>
      <select id="cert-tower"><option value="">— aucun en particulier —</option>
        ${towers.map(t=>`<option value="${t.id}">${t.nickname} (${GAMMES[t.gamme].label})</option>`).join('')}
      </select></div>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-block" data-close-modal>Annuler</button>
      <button class="btn btn-gold btn-block" data-action="confirm-certificate">Générer</button>
    </div>`;
  openModal(html);
  document.getElementById('cert-motif').onchange = (e)=>{
    document.getElementById('cert-custom-wrap').style.display = e.target.value==='__custom' ? 'block':'none';
  };
  document.querySelector('[data-action="confirm-certificate"]').onclick = ()=>{
    const name = document.getElementById('cert-name').value.trim() || `Élève`;
    const motifSel = document.getElementById('cert-motif');
    const motif = motifSel.value==='__custom' ? (document.getElementById('cert-custom').value.trim()||motifs[0]) : motifSel.value;
    const towerId = document.getElementById('cert-tower').value;
    const cert = {id:uuid(), name, motif, towerId, date:todayISO()};
    state.certificates.unshift(cert);
    saveState();
    closeModal();
    state.tab = 'certificate'; state.lastCertificate = cert;
    render();
  };
}

/* ============================= RENDU ============================= */
state.tab = state.tab || 'dashboard';

function setTab(tab){ state.tab = tab; render(); }

function render(){
  renderTabbar();
  const view = document.getElementById('view');
  if(state.tab==='dashboard') view.innerHTML = renderDashboard();
  else if(state.tab==='collection') view.innerHTML = renderCollection();
  else if(state.tab==='tower') view.innerHTML = renderTowerDetail(state.currentTower);
  else if(state.tab==='journal') view.innerHTML = renderJournal();
  else if(state.tab==='distinctions') view.innerHTML = renderDistinctions();
  else if(state.tab==='settings') view.innerHTML = renderSettings();
  else if(state.tab==='certificate') view.innerHTML = renderCertificate(state.lastCertificate);
  attachViewHandlers();
}

function renderTabbar(){
  const tabs = [
    {id:'dashboard', label:`Accueil`, icon:ICONS.home},
    {id:'collection', label:`Collection`, icon:ICONS.collection},
    {id:'journal', label:`Journal`, icon:ICONS.journal},
    {id:'distinctions', label:`Distinctions`, icon:ICONS.seal},
    {id:'settings', label:`Réglages`, icon:ICONS.settings},
  ];
  const activeTab = ['tower'].includes(state.tab) ? 'collection' : (state.tab==='certificate' ? 'settings' : state.tab);
  document.getElementById('tabbar').innerHTML = tabs.map(t=>`
    <button class="tab-btn ${activeTab===t.id?'active':''}" data-settab="${t.id}">
      ${t.icon}<span>${t.label}</span><span class="tab-dot"></span>
    </button>`).join('');
}

function renderDashboard(){
  const s = state;
  const prog = stadeProgress(s.xp);
  const vitality = portfolioVitality(s);
  const upcoming = [];
  s.towers.forEach(t=>{
    GAMMES[t.gamme].tasks.forEach(task=>{
      const due = taskDue(t,task);
      if(due <= addDays(todayISO(),5)) upcoming.push({t,task,due,late:due<todayISO()});
    });
  });
  upcoming.sort((a,b)=> a.due.localeCompare(b.due));

  return `
  <div class="view-head">
    <div class="eyebrow">Tableau de bord</div>
    <h2>Bonjour</h2>
    <p>${fmtDate(todayISO())}</p>
  </div>

  <div class="hero">
    <div class="eyebrow">Indice de patrimoine</div>
    <div class="hero-row">
      ${gaugeSVG(prog.pct, {size:70,stroke:6,color:'var(--gold)',track:'rgba(255,255,255,.18)',
        center:`<b style="color:#fff;">${s.xp}</b><span style="color:#cfe0d6;">pts</span>`})}
      <div class="hero-meta">
        <div class="stade">${prog.cur.name}</div>
        <div class="next">${prog.next? `${prog.next.min - s.xp} pts avant « ${prog.next.name} »` : `Stade le plus élevé atteint`}</div>
      </div>
    </div>
  </div>

  <div class="stat-grid" style="margin-top:14px;">
    <div class="stat-tile"><div class="num">${s.towers.length}</div><div class="lbl">Modules</div></div>
    <div class="stat-tile"><div class="num">${vitality}%</div><div class="lbl">Vitalité</div></div>
    <div class="stat-tile"><div class="num">${s.streak.count}</div><div class="lbl">Jours de suite</div></div>
  </div>

  ${s.school.enabled ? `<div class="school-banner" style="margin-top:16px;">${ICONS.cap}<div>Mode Établissement actif — ${s.school.className || 'classe non nommée'}</div></div>` : ''}

  <div class="section-title"><h3>À faire prochainement</h3></div>
  ${upcoming.length ? `<div class="card card-pad">${upcoming.slice(0,6).map(u=>`
      <div class="task-row">
        <button class="task-check" data-complete-task data-tower="${u.t.id}" data-task="${u.task.id}">${ICONS.check}</button>
        <div class="task-label">${u.task.label}<span class="sub">${u.t.nickname} · ${GAMMES[u.t.gamme].label}</span></div>
        <div class="due-pill ${u.late?'overdue':''}">${u.late?`en retard`:fmtDateShort(u.due)}</div>
      </div>`).join('')}</div>`
    : `<div class="card card-pad" style="text-align:center;color:var(--ink-soft);font-size:13px;">${s.towers.length? `Rien à signaler pour l'instant — tout est à jour.` : `Ajoutez un premier module pour démarrer votre patrimoine.`}</div>`}

  <div class="section-title"><h3>Vos modules</h3><button class="link-btn" data-settab="collection">Voir tout</button></div>
  ${renderTowerList(s.towers.slice(0,3))}

  <div style="margin-top:18px;">
    <button class="btn btn-primary btn-block" data-action="open-add-tower">${ICONS.plus} Ajouter un module</button>
  </div>
  `;
}

function renderTowerList(towers){
  if(!towers.length){
    return `<div class="empty card"><div>${ICONS.leaf.replace('icon','icon icon-lg')}</div><h3>Aucun module pour l'instant</h3><p>Commencez votre patrimoine végétal en ajoutant votre premier module MAVA.</p></div>`;
  }
  return `<div class="tower-grid">${towers.map(t=>{
    const g = GAMMES[t.gamme];
    const h = healthPct(t);
    return `<div class="tower-card" data-open-tower="${t.id}">
      <div class="tower-card__top">
        <div class="gamme-chip" style="background:${g.colorSoft};color:${g.colorDark};">${ICONS.leaf}</div>
        <div>
          <div class="tower-card__name">${t.nickname}</div>
          <div class="tower-card__gamme">${g.label}</div>
        </div>
        ${gaugeSVG(h,{size:44,stroke:4,color:g.color,center:`<b style="font-size:11px;">${h}%</b>`})}
        <div class="chevron">${ICONS.chevronRight}</div>
      </div>
      <div class="tower-card__meta">
        <div><b>${t.plants.length}</b>/${g.capacity} spécimens</div>
        <div><b>${t.harvested||0}</b> récoltes</div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

    <h2 class="serif" style="margin:0 0 2px;font-size:20px;">${t.nickname}</h2>
    <div class="eyebrow">${g.label} · installé le ${fmtDateShort(t.installDate)}</div>
    <div style="margin:16px 0 4px;">${gaugeSVG(h,{size:88,stroke:7,color:g.color,center:`<b>${h}%</b><span>vitalité</span>`})}</div>
  </div>

  <div class="section-title"><h3>Fiche technique</h3></div>
  <div class="card card-pad"><div class="stack">
    ${g.specs.map(sp=>`<div class="row-between"><span style="font-size:12.5px;color:var(--ink-soft);">${sp[0]}</span><b style="font-size:12.5px;">${sp[1]}</b></div>`).join('')}

      </div>`;
    }).join('')}

  <div class="section-title"><h3>Spécimens cultivés (${t.plants.length}/${g.capacity})</h3>
    <button class="link-btn" data-action="open-add-plant" data-tower="${t.id}">+ Ajouter</button>

  `;
}

  const tower = state.towers.find(t=>t.id===cert.towerId);
  return `
  <button class="btn btn-ghost btn-sm no-print" data-settab="settings" style="margin-bottom:14px;">${ICONS.chevronLeft} Réglages</button>
  <div class="certificate-wrap">

/* ============================= HANDLERS ============================= */
function attachViewHandlers(){
  document.querySelectorAll('[data-settab]').forEach(el=> el.onclick = ()=> setTab(el.getAttribute('data-settab')));
  document.querySelectorAll('[data-open-tower]').forEach(el=> el.onclick = ()=>{ state.tab='tower'; state.currentTower = el.getAttribute('data-open-tower'); render(); });
  document.querySelectorAll('[data-complete-task]').forEach(el=> el.onclick = ()=> completeTask(el.getAttribute('data-tower'), el.getAttribute('data-task')));
  document.querySelectorAll('[data-action="harvest-plant"]').forEach(el=> el.onclick = ()=> harvestPlant(el.getAttribute('data-tower'), el.getAttribute('data-plant')));
  document.querySelectorAll('[data-action="open-add-tower"]').forEach(el=> el.onclick = modalAddTower);
  document.querySelectorAll('[data-action="open-add-plant"]').forEach(el=> el.onclick = ()=> modalAddPlant(el.getAttribute('data-tower')));
  document.querySelectorAll('[data-action="open-certificate"]').forEach(el=> el.onclick = modalCertificate);
  document.querySelectorAll('[data-action="view-certificate"]').forEach(el=> el.onclick = ()=>{
    const c = state.certificates.find(x=>x.id===el.getAttribute('data-cert'));
    state.tab='certificate'; state.lastCertificate=c; render();
  });
  document.querySelectorAll('[data-action="print-certificate"]').forEach(el=> el.onclick = ()=> window.print());

  const schoolToggle = document.getElementById('school-toggle');
  if(schoolToggle) schoolToggle.onchange = (e)=>{ state.school.enabled = e.target.checked; saveState(); render(); };
  const saveSchoolBtn = document.querySelector('[data-action="save-school"]');
  if(saveSchoolBtn) saveSchoolBtn.onclick = ()=>{
    state.school.className = document.getElementById('class-name').value.trim();
    state.school.responsables = document.getElementById('class-list').value.split('\n').map(x=>x.trim()).filter(Boolean);
    saveState(); showToast(`Classe enregistrée`, state.school.className, ICONS.cap);
  };
  const exportBtn = document.querySelector('[data-action="export-data"]');
  if(exportBtn) exportBtn.onclick = ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='patrimoine-mava-sauvegarde.json'; a.click();
    URL.revokeObjectURL(url);
  };
  const importInput = document.getElementById('import-file');
  if(importInput) importInput.onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        state = Object.assign(defaultState(), parsed);
        saveState(); render();
        showToast(`Sauvegarde restaurée`, '', ICONS.check);
      }catch(err){ showToast(`Fichier invalide`, '', ICONS.close); }
    };
    reader.readAsText(file);
  };
  const resetBtn = document.querySelector('[data-action="reset-data"]');
  if(resetBtn) resetBtn.onclick = ()=>{
    if(confirm(`Réinitialiser toutes les données de l'application ? Cette action est irréversible.`)){
      state = defaultState(); saveState(); render();
    }
  };
}

document.addEventListener('click', (e)=>{
  if(e.target.closest('[data-close-modal]') && (e.target.hasAttribute('data-close-modal') || e.target.closest('.modal-overlay')===e.target)){
    closeModal();
  }
});

render();

/* Service worker */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}
</script>
</body>
</html>
